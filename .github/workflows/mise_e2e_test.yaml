name: mise E2E tests

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mise_e2e_test.yaml'
      - 'metadata.lua'
      - 'hooks/**'
      - 'lib/**'
  pull_request:
    paths:
      - '.github/workflows/mise_e2e_test.yaml'
      - 'metadata.lua'
      - 'hooks/**'
      - 'lib/**'
  workflow_dispatch:
  schedule:
    # Runs at 12am UTC
    - cron: '0 0 * * *'

jobs:
  mise_e2e_tests:
    strategy:
      fail-fast: false
      matrix:
        # ref: https://github.com/actions/runner-images
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install mise (Unix-like)
        if: runner.os != 'Windows'
        run: |
          curl https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify mise installation (Unix-like)
        if: runner.os != 'Windows'
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          mise --version

      - name: Link local Elixir plugin for PR validation
        if: runner.os != 'Windows'
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          mise plugins link vfox-elixir-ci "$GITHUB_WORKSPACE"

      - name: Install Erlang/OTP & Elixir via mise (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get -y install build-essential autoconf m4 libncurses-dev libssl-dev libssh-dev unixodbc-dev xsltproc fop libxml2-utils openjdk-11-jdk
          export MAKEFLAGS=-j4
          export PATH="$HOME/.local/bin:$PATH"
          
          mise install vfox:version-fox/vfox-erlang@26.2.3
          mise use -g vfox:version-fox/vfox-erlang@26.2.3
          eval "$(mise env)"
          which erl
          which erlc

          mise install vfox-elixir-ci@1.16.2
          mise use -g vfox-elixir-ci@1.16.2
          eval "$(mise env)"
          elixirc -v
          cd assets
          elixir hello.ex


      - name: Install Erlang/OTP & Elixir via mise (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install autoconf libxslt fop wxwidgets openssl
          export MAKEFLAGS=-j4
          export PATH="$HOME/.local/bin:$PATH"
          
          mise install vfox:version-fox/vfox-erlang@26.2.3
          mise use -g vfox:version-fox/vfox-erlang@26.2.3
          eval "$(mise env)"
          which erl
          which erlc

          mise install vfox-elixir-ci@1.16.2
          mise use -g vfox-elixir-ci@1.16.2
          eval "$(mise env)"
          elixirc -v
          cd assets
          elixir hello.ex
